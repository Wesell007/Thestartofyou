name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # CI exercises the frontend with mocked backend boundaries. Production
      # deployment must provide the real public Supabase values separately.
      VITE_SUPABASE_URL: https://ci-test.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-test-public-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint -- --max-warnings=0
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
