<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true">
  <!-- TSOY chapter illustration family: CONCEPT. One illustrator's hand: a single-weight line (ln), a lighter secondary
       line (ln2), one soft page-coloured wash behind the subject, one journey-tinted accent (tint), small marks for
       eyes and spots. Subjects come from the physical journal's world (fawn, rabbit, butterflies, eucalyptus, mushrooms)
       and continue it (fox cub, doe with her fawn). Not AI-generated; not production artwork. -->

  <!-- 1. Trying to conceive: two butterflies over a eucalyptus sprig (lightness, hope, the cover's butterflies) -->
  <symbol id="ch-ttc" viewBox="0 0 240 240">
