# Local-stack identifier only ("distinguishes Supabase projects on the same host"); it does not select
# a remote project. Remote targets are always named explicitly (supabase link / --project-ref / --db-url).
project_id = "thestartofyou"

[functions.ai-search]
verify_jwt = false

[functions.ai-reflect]
verify_jwt = true

[functions.process-email-queue]
verify_jwt = false

[functions.delete-account]
verify_jwt = true

[functions.account-deletion-worker]
verify_jwt = false

# N10.3A: version-controlled bucket declaration (no Storage SQL). Applies to the local stack;
# a hosted project is seeded only through the Storage API (supabase seed buckets) at an approved step.
[storage.buckets.first-year-memories]
public = false
